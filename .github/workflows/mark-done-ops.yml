name: Mark-done ops

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        required: true
        type: string
      proposal_path:
        required: false
        type: string
        default: ""
      allocation_id:
        required: false
        type: string
        default: ""

jobs:
  done:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mark done (ops)
        env:
          PLEBLY_HOOK_SECRET: ${{ secrets.PLEBLY_HOOK_SECRET }}
          PLEBLY_API_URL: ${{ vars.PLEBLY_API_URL }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          PROPOSAL_PATH: ${{ inputs.proposal_path }}
          ALLOCATION_ID: ${{ inputs.allocation_id }}
        run: node scripts/mark-done-ops.mjs
